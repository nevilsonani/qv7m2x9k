name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest --cov=app --cov-report=term-missing
      - name: OpenAPI schema committed for the frontend is up to date
        run: python -m app.openapi /tmp/openapi.json && diff /tmp/openapi.json ../frontend/src/api/openapi.json
      - name: Vercel requirements match backend requirements
        run: diff <(grep -v '^#' ../requirements.txt) requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t winddesk .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name winddesk winddesk
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/decisions/2026-01-15 > /dev/null
          curl -fsS localhost:8000/ | grep -q WindDesk
          curl -fsS localhost:8000/accuracy | grep -q WindDesk
