[project]
name = "winddesk-backend"
version = "1.0.0"
description = "WindDesk API: GB day-ahead wind forecast monitoring"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PD", "NPY"]
ignore = [
    "RUF001", # en dashes in user-facing copy are intentional
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
